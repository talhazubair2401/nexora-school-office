{% if page.has_other_pages %}
<nav class="d-flex justify-content-between align-items-center p-3 no-print" aria-label="Pages">
  <span class="text-muted small">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  <ul class="pagination pagination-sm mb-0">
    {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{% if page.querystring %}{{ page.querystring }}&amp;{% endif %}page={{ page.previous_page_number }}">Previous</a></li>{% endif %}
    {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{% if page.querystring %}{{ page.querystring }}&amp;{% endif %}page={{ page.next_page_number }}">Next</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
