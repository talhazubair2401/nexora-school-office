{% extends "base.html" %}
{% block title %}Confirm{% endblock %}
{% block crumbs %}<span>{{ title }}</span>{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <form method="post" class="panel">{% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <div class="panel-body">
        <h1 class="page-title mb-2">{{ title }}</h1>
        <p class="mb-1">{{ message }}</p>
        <p class="text-danger fw-semibold mb-0">This can't be undone.</p>
      </div>
      <div class="panel-body border-top d-flex gap-2">
        <button class="btn btn-danger" type="submit">{{ button }}</button>
        <a class="btn btn-light" href="{{ cancel_url }}">Keep it</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
