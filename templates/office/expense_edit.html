{% extends "base.html" %}
{% load office_tags %}
{% block title %}Edit expense{% endblock %}
{% block crumbs %}<a href="{{ back }}">Other expenses</a><span>Edit</span>{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <h1 class="page-title mb-3">Edit expense</h1>
  <form method="post" class="panel">{% csrf_token %}
    <div class="panel-body row g-3">{% include "partials/fields.html" with fields=form %}</div>
    <div class="panel-body border-top d-flex gap-2">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-light" href="{{ back }}">Cancel</a>
      <button class="btn btn-light text-danger ms-auto" type="submit" name="delete" value="1" data-confirm="Delete this expense of {{ e.amount|rs }}?" data-confirm-yes="Delete" data-confirm-danger="1"><i class="bi bi-trash me-1"></i>Delete</button>
    </div>
  </form>
</div></div>
{% endblock %}
